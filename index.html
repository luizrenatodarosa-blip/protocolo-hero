<style>
:root{--bg:#07090f;--card:#111623;--card2:#171e30;--line:#26304a;--tx:#eef2ff;--mut:#8b96b8;--a:#27e0ff;--b:#ffb52e;--ok:#3dffa0;--bad:#ff4d6d;
--f:'Arial Narrow','Roboto Condensed','Helvetica Neue Condensed','Impact',sans-serif;--s:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#07090f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--s);font-size:16px}
body{background:radial-gradient(900px 500px at 80% -10%,#12335a55,transparent),radial-gradient(700px 400px at -10% 30%,#3a1d6b33,transparent),var(--bg);min-height:100%}
#app{max-width:520px;margin:0 auto;padding:18px 16px 110px}
h1,h2,h3,.big{font-family:var(--f);text-transform:uppercase;margin:0;letter-spacing:.02em}
.logo{font-family:var(--f);font-size:15px;letter-spacing:.35em;color:var(--a);display:flex;align-items:center;gap:8px}
.logo i{width:8px;height:8px;background:var(--a);box-shadow:0 0 12px var(--a);border-radius:2px;transform:rotate(45deg)}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 12px 30px #0008,inset 0 1px #ffffff10;animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.hero{position:relative;overflow:hidden;border-color:#27e0ff55;background:linear-gradient(150deg,#0f2a44,#111623 60%)}
.hero:after{content:attr(data-l);position:absolute;right:-6px;top:-30px;font:700 190px/1 var(--f);color:#27e0ff14}
.lbl{font-size:12px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase;font-weight:600}
.big{font-size:54px;line-height:1;font-weight:700}
.btn{width:100%;border:0;border-radius:16px;padding:18px;font:700 22px var(--f);letter-spacing:.08em;text-transform:uppercase;color:#04101a;background:linear-gradient(90deg,var(--a),#6af0c8);box-shadow:0 0 24px #27e0ff55;cursor:pointer;margin-top:14px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.g{background:var(--card2);color:var(--tx);border:1px solid var(--line);box-shadow:none;font-size:16px;padding:14px}
.btn.o{background:linear-gradient(90deg,var(--b),#ff8a2e);box-shadow:0 0 22px #ffb52e44}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#0b0f1a;border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{font:700 34px var(--f);display:block;color:var(--a)}
.bar{height:10px;border-radius:9px;background:#0b0f1a;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--ok));border-radius:9px;transition:width .6s}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#07090fe6;backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5}
.tabs button{flex:1;max-width:160px;background:none;border:0;color:var(--mut);font:600 12px var(--s);padding:8px;border-radius:12px;letter-spacing:.1em;text-transform:uppercase}
.tabs button.on{color:var(--a);background:#27e0ff14}.tabs span{display:block;font-size:20px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:#0b0f1a;border:1px solid var(--line);font-size:12px;color:var(--mut)}
.pill.a{color:var(--a);border-color:#27e0ff66}.pill.k{color:var(--b);border-color:#ffb52e66}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.sel{display:flex;gap:8px;margin:10px 0}.sel button,.opt{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);background:#0b0f1a;color:var(--tx);font:700 18px var(--f);text-transform:uppercase;text-align:center}
.sel button.on,.opt.on{border-color:var(--a);background:#27e0ff1c;box-shadow:0 0 16px #27e0ff33}
.opt{display:block;width:100%;margin-top:8px;font-size:17px}
.ex .n{font:700 80px/0.9 var(--f);color:#27e0ff30;float:right}
.ex h2{font-size:34px;line-height:1.05;margin:6px 0 4px}
.set{display:flex;gap:8px;align-items:center;margin-top:10px;padding:8px;border-radius:14px;background:#0b0f1a;border:1px solid var(--line)}
.set.done{border-color:#3dffa066;background:#3dffa00f}
.set em{font:700 20px var(--f);font-style:normal;width:26px;color:var(--mut)}
.set input{width:100%;min-width:0;background:#171e30;border:1px solid var(--line);border-radius:10px;color:var(--tx);font:700 22px var(--f);padding:10px 4px;text-align:center}
.set small{display:block;color:var(--mut);font-size:10px;text-align:center;letter-spacing:.1em}
.chk{flex:none;width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:none;color:var(--ok);font-size:26px}
.done .chk{background:var(--ok);color:#04101a;border-color:var(--ok)}
.fb{display:flex;gap:8px;margin-top:14px}.fb button{flex:1;padding:12px 4px;border-radius:14px;border:1px solid var(--line);background:#0b0f1a;color:var(--tx);font-size:13px;font-weight:600}
.fb button.on{border-color:var(--b);background:#ffb52e22}.fb span{display:block;font-size:24px}
.msg{margin-top:10px;padding:12px;border-radius:14px;background:#ffb52e18;border:1px solid #ffb52e55;color:#ffd98a;font-size:14px}
.msg.c{background:#27e0ff12;border-color:#27e0ff55;color:#bff4ff}
body.modal-open{overflow:hidden}
body.modal-open .nav-workout{visibility:hidden}
.ov{position:fixed;inset:0;background:#05070cf2;z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow:auto;animation:up .25s}
.ov>div{position:relative;width:100%;max-width:480px;max-height:none;overflow:auto;text-align:center;margin:max(10px,env(safe-area-inset-top,0px)) auto 28px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.modal-kicker{font-size:11px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase;font-weight:800}.modal-close{border:1px solid #324361;background:#101827;color:#dce7ff;border-radius:12px;padding:10px 12px;font-weight:900;font-size:16px;min-width:46px}
.ring{position:relative;width:260px;height:260px;margin:10px auto}
.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 82px var(--f)}
.top{position:sticky;top:0;z-index:4;background:#07090fe8;backdrop-filter:blur(10px);margin:-18px -16px 0;padding:14px 16px 10px}
.dots{display:flex;gap:4px;margin-top:8px}.dots i{flex:1;height:5px;border-radius:4px;background:var(--line)}.dots i.d{background:var(--ok)}.dots i.c{background:var(--a);box-shadow:0 0 8px var(--a)}
.del{background:none;border:0;color:var(--bad);font-size:13px;padding:8px 0}
.confetti{animation:pulse 1.4s infinite}@keyframes pulse{50%{text-shadow:0 0 30px var(--a)}}
.hrow{font-size:14px;color:var(--mut);margin-top:6px;line-height:1.5}.hrow b{color:var(--tx)}
@media(min-width:700px){#app{padding-top:40px}}

body{background:
 radial-gradient(700px 420px at 85% -8%,#1d6fff30,transparent 70%),
 radial-gradient(600px 400px at -10% 25%,#7a3cff22,transparent 70%),

#app{position:relative;z-index:1}

 background:linear-gradient(165deg,#1a2238,#0f1422 70%) padding-box,linear-gradient(140deg,#27e0ff66,#26304a 35%,#26304a 65%,#ffb52e40) border-box;
 box-shadow:0 18px 40px -10px #000c,0 0 0 1px #0006,inset 0 1px 0 #ffffff14}

.hero{border-radius:26px 26px 26px 54px;background:linear-gradient(150deg,#0e3050ee,#101827 62%) padding-box,linear-gradient(140deg,#27e0ff,#27e0ff22 40%,#ffb52e66) border-box;box-shadow:0 24px 60px -12px #27e0ff40,0 18px 40px -10px #000c,inset 0 1px #ffffff22}

@keyframes sweep{0%{transform:translateX(0)}60%,100%{transform:translateX(480%)}}
.hero .big{background:linear-gradient(180deg,#fff,#27e0ff 55%,#1d6fff);-webkit-background-clip:text;background-clip:text;color:transparent!important;text-shadow:none!important;filter:drop-shadow(0 0 22px #27e0ff80);font-size:110px!important;line-height:.9}

.lbl{font-size:11px;letter-spacing:.32em;color:#6fd8ee}
.big{font-variant-numeric:tabular-nums}
.btn{position:relative;overflow:hidden;border-radius:18px;padding:20px;font-size:23px;letter-spacing:.14em;background:linear-gradient(100deg,#27e0ff,#5af2d0 60%,#3dffa0);box-shadow:0 10px 30px -6px #27e0ff88,inset 0 1px #fff9,inset 0 -3px 0 #0003;transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.btn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff8,transparent);transform:skewX(-20deg);animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.btn:active{transform:scale(.96) translateY(1px);box-shadow:0 4px 14px -4px #27e0ff88}.btn.g{background:linear-gradient(180deg,#1b2338,#121827);border:1px solid #2c3858;box-shadow:inset 0 1px #ffffff12,0 6px 14px -6px #000a;letter-spacing:.08em;font-size:16px}.btn.g:after{display:none}
.btn.o{background:linear-gradient(100deg,#ffb52e,#ff7a2e);box-shadow:0 10px 30px -6px #ff8a2e88,inset 0 1px #fff8,inset 0 -3px 0 #0003}
.stat{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(160deg,#0e1424,#0a0e1a);font-size:11px;letter-spacing:.2em;color:var(--mut);font-weight:600}
.stat:before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:linear-gradient(var(--a),transparent)}
.stat b{font-size:40px;line-height:1.1;letter-spacing:0;background:linear-gradient(180deg,#fff,#27e0ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:2px}
.bar{height:12px;box-shadow:inset 0 2px 4px #000a;border:1px solid #1d2640}
.bar i{background:linear-gradient(90deg,#1d6fff,#27e0ff,#3dffa0);box-shadow:0 0 14px #27e0ffaa;position:relative}
.bar i:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff6,transparent 70%);animation:shine2 2.6s infinite}@keyframes shine2{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.tabs{left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 28px);max-width:400px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:6px;border:1px solid #2c3858;border-radius:28px;background:#0b101dd9;box-shadow:0 18px 40px #000c,inset 0 1px #ffffff14}
.tabs button{border-radius:22px;transition:all .25s;font-size:11px;letter-spacing:.14em}

.tabs button.on span{filter:drop-shadow(0 0 8px #27e0ff)}
.pill{text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:600;padding:5px 11px}
.pill.a{background:#27e0ff14;box-shadow:0 0 12px #27e0ff25}
.ex{padding:22px 18px}
.ex .n{font-size:110px;line-height:.8;color:transparent;-webkit-text-stroke:1.5px #27e0ff55;margin:-8px -2px 0 0}
.ex h2{font-size:38px;margin-top:10px;text-shadow:0 2px 20px #27e0ff30}
.ex .big{background:linear-gradient(90deg,#ffb52e,#ff8a2e);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.set{border-radius:18px;transition:all .3s;background:linear-gradient(160deg,#0e1424,#0a0e1a)}
.set.done{background:linear-gradient(160deg,#3dffa022,#0a0e1a);box-shadow:0 0 22px #3dffa026,inset 0 0 0 1px #3dffa044;animation:glowin .6s}
@keyframes glowin{from{box-shadow:0 0 50px #3dffa0aa}}
.set em{color:#4d5a82}

/* ===== PROTOCOLO HERO 3.0 · PRODUCT/UX PASS ===== */
:root{--glass:#0c1220cc;--cyan:#27e0ff;--cyan2:#69f2ff;--amber:#ffb52e;--green:#3dffa0}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.18;background-image:radial-gradient(#ffffff 0.5px,transparent .5px);background-size:22px 22px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}
.logo{position:relative}.logo:after{content:"ONLINE";font:700 9px var(--s);letter-spacing:.16em;color:#3dffa0;background:#3dffa014;border:1px solid #3dffa040;padding:3px 7px;border-radius:99px;margin-left:auto}
.hero{min-height:330px;display:flex;flex-direction:column;justify-content:flex-end;padding-top:34px}
.hero .lbl{margin-bottom:auto}.hero .hrow{font-size:15px;color:#b5c1df}
.hero .btn,.hero .btn.o{margin-top:22px}
.card{backdrop-filter:blur(12px)}
.card.section{padding:16px 18px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.section-title .lbl{margin:0}.section-title .mini{font-size:11px;color:var(--mut)}
.metric-strip{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;margin-top:14px}
.metric{background:linear-gradient(160deg,#0c1220,#090d17);border:1px solid #26304a;border-radius:16px;padding:10px 12px;min-width:0}
.metric small{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#7481a5;margin-bottom:3px;white-space:nowrap}
.metric b{display:block;font:700 20px var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f6f8ff}
.metric b.c{color:var(--cyan)}.metric b.a{color:var(--amber)}
.focus-block{margin-top:14px;padding:14px;border-radius:18px;background:linear-gradient(180deg,#11182a,#0b101b);border:1px solid #2a3553;box-shadow:inset 0 1px #ffffff0d}
.focus-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.focus-head span{font-size:10px;letter-spacing:.18em;color:#7b89ad;text-transform:uppercase;font-weight:700}
.set{padding:10px 10px 10px 12px;border-color:#293451}.set em{font-size:24px;color:#7180a8}.set.done em{color:var(--green)}
.set input{font-size:26px;padding:12px 6px;background:#11182a}
.chk{flex:0 0 58px}
.secondary-actions{margin-top:12px;border:1px solid #26304a;border-radius:18px;overflow:hidden;background:#0b101a}
.secondary-actions summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#c7d0e7;display:flex;align-items:center;justify-content:space-between}
.secondary-actions summary::-webkit-details-marker{display:none}.secondary-actions summary:after{content:"＋";color:var(--cyan);font-size:20px}.secondary-actions[open] summary:after{content:"−"}
.secondary-actions .inside{padding:0 12px 12px}
.machine-badge{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:16px;background:linear-gradient(90deg,#ffb52e18,#ffb52e07);border:1px solid #ffb52e55}
.machine-badge .icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#ffb52e1a;border:1px solid #ffb52e44;font-size:17px}

.atlas-caption{padding:10px 12px;background:linear-gradient(180deg,#101827,#0b101d);color:var(--mut);font-size:11px;line-height:1.4;letter-spacing:.03em}
.nav-workout{display:grid!important;grid-template-columns:minmax(0,.92fr) minmax(0,2.08fr);gap:10px;align-items:stretch}
.nav-workout .btn{min-height:58px;margin:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.nav-workout .prev{font-size:14px;letter-spacing:.08em}
.nav-workout .next{font-size:18px;letter-spacing:.08em}
.nav-workout .btn[disabled]{pointer-events:none;filter:saturate(.45);opacity:.34!important}
.exercise-position{display:flex;justify-content:center;margin:2px 0 10px;color:var(--mut);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
@media(max-width:380px){.nav-workout{grid-template-columns:1fr 1.75fr}.nav-workout .next{font-size:16px}.nav-workout .prev{font-size:12px}}

function guideKind(name){name=(name||'').toLowerCase();
 if(name.includes('row')||name.includes('remada'))return 'row';
 if(name.includes('curl')||name.includes('bíceps')||name.includes('biceps'))return 'curl';
 if(name.includes('t-fly')||name.includes('y-fly')||name.includes('fly'))return 'fly';
 if(name.includes('chest press')||name.includes('press')||name.includes('supino'))return 'press';
 if(name.includes('triceps'))return 'triceps';
 if(name.includes('anti-rotation'))return 'antirot';
 if(name.includes('body saw'))return 'bodysaw';
 if(name.includes('hamstring'))return 'hamcurl';
 if(name.includes('glute bridge'))return 'bridge';

function runsWeek(){const w=weekStart(Date.now());return RH().filter(r=>weekStart(r.t)===w)}
function padelWeek(){const w=weekStart(Date.now());return PH().filter(r=>weekStart(r.t)===w)}
function pace(dist,min){dist=parseFloat(dist);min=parseFloat(min);if(!dist||!min)return '—';const p=min/dist,m=Math.floor(p),sec=Math.round((p-m)*60);return m+':'+String(sec===60?0:sec).padStart(2,'0')+(sec===60?' (+1 min)':'')+' /km'}
function allKnees(){return H().filter(x=>x.knee).map(x=>({t:x.t,knee:x.knee})).concat(RH().filter(x=>x.knee).map(x=>({t:x.t,knee:x.knee})),PH().filter(x=>x.knee).map(x=>({t:x.t,knee:x.knee}))).sort((a,b)=>b.t-a.t)}

const weekStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return +x};
const inWeek=(off=0)=>H().filter(h=>weekStart(h.t)===weekStart(Date.now()-off*6048e5));

function fbHistory(name){return H().map(h=>h.ex.find(e=>e.name===name)).filter(e=>e&&e.fb).map(e=>e.fb)}
function kneeAlert(){const k=H().filter(h=>h.knee).slice(0,2);return k.length==2&&k.every(h=>h.knee==='more')}

function vHist(){const all=[];H().forEach(h=>all.push({kind:'strength',t:h.t,data:h}));RH().forEach(r=>all.push({kind:'run',t:r.t,data:r}));PH().forEach(r=>all.push({kind:'padel',t:r.t,data:r}));all.sort((a,b)=>b.t-a.t);$('#app').innerHTML=`<div class="logo"><i></i>HISTÓRICO</div><h1 style="font-size:42px;margin:14px 0 6px">LINHA DO TEMPO</h1><div class="hrow">Força, corrida e padel em uma única visão.</div>${all.map(x=>{const d=new Date(x.t),day=String(d.getDate()).padStart(2,'0'),mon=d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','').toUpperCase();if(x.kind==='strength'){const h=x.data;return `<div class="timeline-card strength"><div class="timeline-date">${day}<small>${mon}</small></div><div class="timeline-main"><b>Força ${h.w} · ${WORKOUTS[h.w].title}</b><div>${mins(h.dur)} min · ${h.ex.length} exercícios${h.short?' · missão curta':''}</div></div><div class="timeline-icon">🏋️</div></div>`}if(x.kind==='run'){const r=x.data;return `<div class="timeline-card run"><div class="timeline-date">${day}<small>${mon}</small></div><div class="timeline-main"><b>Corrida · ${RUN_LABEL[r.type]}</b><div>${r.dist.toFixed(1)} km · ${r.pace} · ${SHOE_LABEL[r.shoe]}${r.feel?' · '+FEEL_RUN[r.feel]:''}</div></div><div class="timeline-icon">🏃</div></div>`}const r=x.data;return `<div class="timeline-card padel"><div class="timeline-date">${day}<small>${mon}</small></div><div class="timeline-main"><b>Padel</b><div>${r.dur} min · ${EFF_LABEL[r.eff]}${r.feel?' · '+FEEL_PADEL[r.feel]:''}</div></div><div class="timeline-icon">🎾</div></div>`}).join('')||'<div class="card hrow">Nenhuma atividade ainda.</div>'}${footerSign()}` }
function vProg(){const c={A:0,B:0,C:0};H().forEach(h=>c[h.w]++);const wks=[...Array(6)].map((_,o)=>inWeek(5-o).length);const ev={};H().slice().reverse().forEach(h=>h.ex.forEach(e=>{const k=parseFloat(e.kg);if(e.w&&k)(ev[e.name]=ev[e.name]||[]).push(k)}));const top=Object.entries(ev).sort((a,b)=>b[1].length-a[1].length).slice(0,5);const cons=Math.round(wks.filter(x=>x>=3).length/6*100),coreN=H().filter(h=>h.ex.some(e=>e.c)).length;const plateKm=RH().filter(r=>r.shoe==='plate').reduce((a,r)=>a+r.dist,0),plainKm=RH().filter(r=>r.shoe==='plain').reduce((a,r)=>a+r.dist,0),runKm=RH().reduce((a,r)=>a+r.dist,0),knees=knee30();$('#app').innerHTML=`<div class="logo"><i></i>PROGRESSO</div><h1 style="font-size:42px;margin:14px 0 0">PROTOCOLO</h1><div class="progress-tabs"><button>Semana</button><button class="on">Geral</button><button>V1</button></div><div class="progress-grid"><div class="progress-tile force"><small>FORÇA</small><b>${H().length}</b><span class="hrow">A ${c.A} · B ${c.B} · C ${c.C}</span></div><div class="progress-tile run"><small>CORRIDA</small><b>${runKm.toFixed(1)}</b><span class="hrow">km registrados</span></div><div class="progress-tile core"><small>CORE</small><b>${coreN}</b><span class="hrow">treinos</span></div><div class="progress-tile padel"><small>PADEL</small><b>${PH().length}</b><span class="hrow">sessões</span></div></div><div class="card"><div class="section-title"><span class="lbl">TÊNIS · KM ACUMULADO</span></div><div class="grid"><div class="shoe-card">SEM PLACA<b style="color:var(--run)">${plainKm.toFixed(1)} km</b></div><div class="shoe-card">COM PLACA<b>${plateKm.toFixed(1)} km</b></div></div></div><div class="card"><div class="section-title"><span class="lbl">JOELHO · ÚLTIMOS 30 DIAS</span></div><div class="knee-list"><span><i class="dot-status ok"></i>Normal</span><b>${knees.normal}</b><span><i class="dot-status mid"></i>Pouco inchado</span><b>${knees.little}</b><span><i class="dot-status bad"></i>Mais que habitual</span><b>${knees.more}</b></div></div><div class="card"><div class="section-title"><span class="lbl">EVOLUÇÃO DE CARGA</span><span class="mini">principais</span></div>${top.map(([n,a])=>`<div class="hrow"><b>${n}</b>: ${a[0]} → <b style="color:var(--ok)">${a[a.length-1]} kg</b><div class="bar"><i style="width:${Math.min(100,a[a.length-1]/Math.max(...a)*100)}%"></i></div></div>`).join('')||'<div class="hrow">Registre cargas para ver a evolução.</div>'}</div><div class="card"><div class="row sp"><span class="lbl">CONSISTÊNCIA · FORÇA</span><b class="big" style="font-size:38px;color:var(--cyan)">${cons}%</b></div><div class="hrow">Semanas com 3 treinos nas últimas 6 semanas.</div></div>${footerSign()}`}function vMore(){$('#app').innerHTML=`<div class="logo"><i></i>PROTOCOLO</div><h1 style="font-size:42px;margin:14px 0 6px">MAIS</h1><div class="card more-card"><button onclick="view='hist';render()">📜 Histórico<small>Linha do tempo de todas as atividades.</small></button><button onclick="view='prog';render()">📈 Progresso<small>Cargas, quilômetros, consistência e joelho.</small></button><button onclick="view='about';render()">ⓘ Sobre o Protocolo<small>Autoria, versão e informações do app.</small></button></div><div class="card section"><div class="section-title"><span class="lbl">🏟️ ACADEMIA</span><span class="mini">editável</span></div><div class="gym-edit"><input id="gymName" maxlength="32" value="${escapeHTML(Store.d.gymName||'Minha academia')}" placeholder="Nome da academia"><button class="btn g" onclick="Store.d.gymName=($('#gymName').value||'Minha academia').trim();Store.save();render()">Salvar</button></div></div>${footerSign()}`}
function vAbout(){$('#app').innerHTML=`<div class="logo"><i></i>SOBRE</div><div class="card author-card"><span class="vmark">VERSÃO 1</span><h2>PROTOCOLO HERO</h2><p>Treino integrado de força, corrida, padel e core. Criado para registro rápido, clareza durante o treino e acompanhamento pessoal.</p><div class="lbl" style="margin-top:22px">GERADO POR</div><div class="author-name">Luiz Renato da Rosa</div><div class="legal-note">Dados armazenados localmente neste dispositivo. O app não realiza diagnóstico médico e não substitui orientação profissional individualizada.</div></div><button class="btn g" onclick="view='more';render()">VOLTAR</button>${footerSign()}`}

render();
</script>

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
